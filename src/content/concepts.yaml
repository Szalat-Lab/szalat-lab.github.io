# Concepts shown on the Concepts page.
#
# A work is linked to a concept when its title or `topics` field (in publications.bib)
# contains one of the `match` phrases. Matching ignores case and accents, and a phrase
# matches at the start of a word: "transplant" also matches "transplantation".
#
# group sets the node color: disease, genomics, biology, clinical, population
#
# To add a concept, copy a block:
#   - id: short-id            # used in the page URL: /concepts/short-id/
#     label: Display Name
#     group: genomics
#     match: ["phrase one", "phrase two"]

# --- Diseases -----------------------------------------------------------------
- id: multiple-myeloma
  label: Multiple myeloma
  group: disease
  match: ["myeloma", "myélome"]
- id: al-amyloidosis
  label: AL amyloidosis
  group: disease
  match: ["amyloidosis", "amylose", "light chain amyloid", "light-chain amyloid"]
- id: precursor-states
  label: MGUS and smoldering myeloma
  group: disease
  match: ["mgus", "monoclonal gammopathy of undetermined", "smoldering", "precursor"]
- id: mgcs
  label: Monoclonal gammopathies of clinical significance
  group: disease
  match: ["clinical significance", "renal significance", "mgrs", "mgcs", "deposition disease", "paraproteinemia", "monoclonal immunoglobulin", "monoclonal gammopathy associated", "associated with a monoclonal", "associated with monoclonal", "gammapathie"]
- id: waldenstrom
  label: Waldenström and IgM disorders
  group: disease
  match: ["waldenstr", "igm", "anti-mag"]
- id: cryoglobulinemia
  label: Cryoglobulinemia
  group: disease
  match: ["cryoglobulin", "cryofibrinogen"]
- id: xanthogranuloma
  label: Xanthomatosis and xanthogranuloma
  group: disease
  match: ["xanthom", "xanthogranuloma"]
- id: castleman
  label: Castleman disease
  group: disease
  match: ["castleman"]
- id: other-cancers
  label: Other cancers
  group: disease
  match: ["breast", "chronic lymphocytic", "cancer patients", "multiple primary"]
- id: covid-19
  label: COVID-19 and infection
  group: disease
  match: ["covid", "coronavirus", "sars-cov", "infection", "febrile neutropenia"]

